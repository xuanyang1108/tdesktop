name: Windows Grok build

# One x64 Release portable build for this fork.
# Without API_ID / API_HASH secrets it uses the open credentials already
# committed in .github/workflows/win.yml (api_id 611335). See
# docs/grok-windows-build.md.

on:
  workflow_dispatch:
  push:
    branches:
      - 'cursor/**'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: win-grok-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      SECRET_API_ID: ${{ secrets.API_ID }}
      SECRET_API_HASH: ${{ secrets.API_HASH }}
      SECRET_API_ID_ALT: ${{ secrets.TELEGRAM_API_ID }}
      SECRET_API_HASH_ALT: ${{ secrets.TELEGRAM_API_HASH }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Free runner disk space.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Show-Free([string]$label) {
            $free = (Get-PSDrive -Name C).Free
            Write-Host ("{0}: {1:N2} GB free" -f $label, ($free / 1GB))
          }
          Show-Free 'Before cleanup'
          $python = Get-Command python -ErrorAction SilentlyContinue
          $keepPython = $null
          if ($python -and $python.Source -match 'hostedtoolcache\\windows\\Python\\([^\\]+)') {
            $keepPython = $Matches[1]
            Write-Host "Keeping Python $($python.Source)"
          }
          $dirs = @(
            'C:\Program Files\Microsoft SQL Server',
            'C:\Program Files (x86)\Microsoft SQL Server',
            'C:\Program Files\PostgreSQL',
            'C:\Program Files\MySQL',
            'C:\Program Files\MongoDB',
            'C:\Program Files (x86)\Android',
            'C:\Android',
            'C:\Program Files\Google\Chrome',
            'C:\Program Files (x86)\Google\Chrome',
            'C:\Program Files\Mozilla Firefox',
            'C:\Program Files\Microsoft Office',
            'C:\Program Files (x86)\Microsoft Office',
            'C:\Program Files\dotnet\sdk',
            'C:\Program Files\dotnet\shared',
            'C:\ProgramData\Package Cache',
            'C:\Windows\SoftwareDistribution\Download'
          )
          foreach ($dir in $dirs) {
            if (Test-Path -LiteralPath $dir) {
              Write-Host "Removing $dir"
              cmd /c "rmdir /s /q `"$dir`""
            }
          }
          $toolcache = 'C:\hostedtoolcache\windows'
          if (Test-Path $toolcache) {
            Get-ChildItem $toolcache -Directory | ForEach-Object {
              if ($_.Name -eq 'Python') {
                Get-ChildItem $_.FullName -Directory | ForEach-Object {
                  if ($keepPython -and $_.Name -eq $keepPython) {
                    Write-Host "Keeping $($_.FullName)"
                  } else {
                    Write-Host "Removing $($_.FullName)"
                    cmd /c "rmdir /s /q `"$($_.FullName)`""
                  }
                }
              } else {
                Write-Host "Removing $($_.FullName)"
                cmd /c "rmdir /s /q `"$($_.FullName)`""
              }
            }
          }
          Show-Free 'After cleanup'

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake
          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v3-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-

      - name: Choose Telegram API credentials.
        shell: bash
        run: |
          ID="${SECRET_API_ID:-$SECRET_API_ID_ALT}"
          HASH="${SECRET_API_HASH:-$SECRET_API_HASH_ALT}"
          if [ -n "$SECRET_API_ID$SECRET_API_ID_ALT$SECRET_API_HASH$SECRET_API_HASH_ALT" ]; then
            if [ -z "$ID" ] || [ -z "$HASH" ]; then
              echo "Set both API_ID and API_HASH (or both TELEGRAM_API_ID and TELEGRAM_API_HASH)."
              exit 1
            fi
            echo "Using Telegram API credentials from Actions secrets (api_id $ID)."
            API="-D TDESKTOP_API_ID=$ID -D TDESKTOP_API_HASH=$HASH"
            echo "$ID" > "$RUNNER_TEMP/grok_api_id.txt"
          else
            echo "No API_ID/API_HASH secrets. Using open credentials api_id 611335."
            API="-D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c"
            echo "611335" > "$RUNNER_TEMP/grok_api_id.txt"
          fi
          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Repair pruned Rust sources.
        shell: bash
        run: |
          cpp="$LibrariesPath/tdesktop_rust/out/src/wallet_engine/wallet_engine.cpp"
          if [ -f "$cpp" ]; then
            echo "wallet_engine.cpp is present."
          else
            echo "wallet_engine.cpp was pruned from the library cache; rebuilding tdesktop_rust."
            rm -f \
              "$LibrariesPath/cache_keys/tdesktop_rust" \
              "$LibrariesPath/cache_keys/tlottie" \
              "$LibrariesPath/cache_keys/wallet-engine"
          fi

      - name: Libraries.
        id: libraries
        run: |
          set CARGO_PROFILE_DEV_DEBUG=0
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent

      - name: Free up some disk space.
        if: steps.libraries.outcome == 'success'
        shell: bash
        run: |
          find "$LibrariesPath" \
            '(' '(' ! '(' \
              -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' \
              -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' \
              -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' \
              -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' \
              -o -path '*/src/wallet_engine/*' \
              -o '(' '(' -path '*/tlottie/*' -o -path '*/wallet-engine/*' ')' ! -path '*/target/*' ')' \
            ')' -type f ')' \
            -o '(' -empty ! -path '*/tlottie/*' ! -path '*/wallet-engine/*' ')' \
            ')' -delete

      - name: Save ThirdParty cache.
        if: steps.libraries.outcome == 'success' && steps.cache-third-party.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}

      - name: Save libraries cache.
        if: steps.libraries.outcome == 'success' && steps.cache-libs.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v3-${{ env.CACHE_KEY }}

      - name: Save Qt cache.
        if: steps.libraries.outcome == 'success' && steps.cache-qt.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}

      - name: Telegram Desktop build.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat x64 ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Debug ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          rem Debug matches the skip-release libraries. Qt Network needs dnsapi.
          cmake --build ..\out --config Debug --parallel --target Telegram --target Updater

      - name: Pack portable zip.
        shell: pwsh
        run: |
          $out = Join-Path $env:TBUILD "$env:REPO_NAME\out\Debug"
          $stage = Join-Path $env:GITHUB_WORKSPACE "artifact\Telegram"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $out "Telegram.exe") $stage
          if (Test-Path (Join-Path $out "Updater.exe")) {
            Copy-Item (Join-Path $out "Updater.exe") $stage
          }
          $modules = Join-Path $out "modules"
          if (Test-Path $modules) {
            Copy-Item $modules (Join-Path $stage "modules") -Recurse
          }
          $apiId = (Get-Content (Join-Path $env:RUNNER_TEMP "grok_api_id.txt") -Raw).Trim()
          $note = @(
            "64Gram Grok employees test build."
            "Telegram api_id compiled into this exe: $apiId"
            "Default when no Actions secrets are set: 611335 (open credentials, see docs/grok-windows-build.md)."
            "To use your own later, set repository secrets API_ID and API_HASH and rerun Windows Grok build."
            "The xAI key is entered in the panel settings after launch. It is not in this zip."
            "This is the Debug build, matching the Debug libraries from prepare (skip-release)."
            "Autoupdate is disabled."
          ) -join "`n"
          Set-Content -Encoding utf8 -Path (Join-Path $stage "BUILD.txt") -Value $note
          $zip = Join-Path $env:GITHUB_WORKSPACE "64Gram-Grok-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE "artifact\*") -DestinationPath $zip

      - uses: actions/upload-artifact@v7
        name: Upload portable zip.
        with:
          name: 64Gram-Grok-win-x64
          path: 64Gram-Grok-win-x64.zip
          retention-days: 14
